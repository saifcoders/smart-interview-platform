<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Interview</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .register-container {
            width: 400px;
            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            color: #111827;

            font-size: 28px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .register-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;

            text-align: center;

            font-size: 14px;
            min-height: 20px;
        }

        .back {
            display: block;

            margin-top: 15px;

            text-align: center;

            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            Smart Interview
        </div>

        <p class="subtitle">
            Create an account to start your preparation
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Min 6 characters"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
                id="registerButton">

                Register

            </button>

        </form>


        <div
            class="message"
            id="message">
        </div>


        <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280;">
            Already have an account? <a href="/login.html" style="color: #2563eb; text-decoration: none; font-weight: bold;">Login</a>
        </p>


        <a
            href="/index.html"
            class="back">

            ← Back to Home

        </a>

    </div>


    <script>

        const registerForm = document.getElementById("registerForm");

        const registerButton =
            document.getElementById("registerButton");

        const message =
            document.getElementById("message");


        registerForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // Client-side validations
            if (!name) {
                showMessage("Name must not be empty.", "red");
                return;
            }

            if (!validateEmail(email)) {
                showMessage("Please enter a valid email format.", "red");
                return;
            }

            if (!password) {
                showMessage("Password must not be empty.", "red");
                return;
            }

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters long.", "red");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "red");
                return;
            }


            registerButton.disabled = true;

            registerButton.innerText = "Creating account...";

            message.innerText = "";


            try {

                const response = await fetch(
                    "/api/users/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


                if (response.ok) {

                    showMessage("Registration successful! Redirecting to login...", "green");


                    setTimeout(function() {

                        window.location.href =
                            "/login.html";

                    }, 1500);

                } else {

                    if (response.status === 409) {
                        showMessage("Email address already registered.", "red");
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        showMessage(errorData.message || "Registration failed. Invalid input.", "red");
                    }

                }

            } catch (error) {

                console.error(error);

                showMessage("Unable to connect to server.", "red");

            }


            registerButton.disabled = false;

            registerButton.innerText = "Register";

        });


        function showMessage(text, color) {
            message.style.color = color;
            message.innerText = text;
        }


        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

    </script>

</body>

</html>
